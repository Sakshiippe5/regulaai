[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regulaai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "pymupdf>=1.24", "groq>=0.11", "pydantic-settings>=2.0", "faiss-cpu>=1.8", "numpy>=1.26", "fastembed>=0.3", "mcp>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]